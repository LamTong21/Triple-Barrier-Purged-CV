# ==============================================================================
# Purged & Embargoed Cross-Validation and Model Hyperparameters
# ==============================================================================
cv:
  n_splits: 5                  # Outer time-series splits
  embargo_days: 5              # Embargo duration h_embargo (safety buffer)
  max_train_size: 750          # Rolling training window length in bars
  buffer_days: 150             # Test lookback buffer to eliminate lag cold-starts

features:
  max_final_features: 4        # Sparsity Cap: 4 orthogonal cluster representatives
  polynomial_degree: 2         # Degree-2 polynomial interaction expansion (10 cols)
  interaction_only: true       # Pure interaction X_i * X_j (no quadratic terms)

model:
  estimator: "logistic_regression"
  penalty: "l2"
  c_regularization: 0.03
  class_weight: "balanced"
  solver: "lbfgs"
  max_iter: 1000

calibration:
  method: "sigmoid"            # Bounded Platt Scaling
  calib_size: 0.3              # Causal split for calibration window
  slope_bounds: [0.1, 2.5]     # a in [0.1, 2.5] to prevent flat slopes
  intercept_bounds: [-1.5, 1.5] # b in [-1.5, 1.5] to mitigate base-rate drift

thresholding:
  rolling_window: 60           # Window W for rolling probability distribution
  enter_percentile: 65.0       # Q = 65% (filters top 35% probability edge)
  sizing_base: 0.20            # Minimum position allocation floor
  sizing_max: 1.00             # Maximum position allocation cap