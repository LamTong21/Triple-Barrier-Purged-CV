name: CI & Quantitative Integrity Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Linting and Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint and formatting check with Ruff
        run: |
          # Stop build if there are Python syntax errors or undefined names
          ruff check . --select=E9,F63,F7,F82 --show-source
          # Warning check for code style
          ruff check . --exit-non-zero-on-fix

      - name: Run Test Suite (Look-Ahead Leakage & Calibration Guards)
        run: |
          pytest -v tests/ --cov=src --cov-report=term-missing